name: EkbReviews build

on:
  push:
    paths:
      - 'EkbReviews.sln'
      - 'Directory.Build.props'
      - 'src/EkbReviews.*/**'
      - 'docker-compose.yml'
      - '.github/workflows/ekb-reviews-build.yml'
  pull_request:
    paths:
      - 'EkbReviews.sln'
      - 'Directory.Build.props'
      - 'src/EkbReviews.*/**'
      - 'docker-compose.yml'
      - '.github/workflows/ekb-reviews-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore EkbReviews.sln
      - run: dotnet build src/EkbReviews.Worker/EkbReviews.Worker.csproj --configuration Release --no-restore
      - run: dotnet build src/EkbReviews.Application.Tests/EkbReviews.Application.Tests.csproj --configuration Release --no-restore
      - run: dotnet test src/EkbReviews.Application.Tests/EkbReviews.Application.Tests.csproj --configuration Release --no-build --verbosity normal
      - run: docker compose config
      - run: docker build -f src/EkbReviews.Worker/Dockerfile .
